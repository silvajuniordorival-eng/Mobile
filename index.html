<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brechó da Aninha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <!--Topo / Logo-->
        <header class="app___header">
            <h1 class="app__logo">Brechó da <span>Aninha</span></h1>
        </header>
        <!--Contéudo Principal (Layout)-->
        <div class="app__content"><section
            class="app__section-texto">
        <h2 class="app__titulo">
            Etilo único, <br>
            <strong>sustentável e com <br>história para contar.</strong>
        </h2>
    </section>
    <section
    class="app__section-imagem">
<!--imagem etilizada com formato orgânico (blob)-->
<div class="imagem-container">
    <img src="sua foto.jpg" alt="Moda vintage brechó"
    class="app__imagem">
</div>
</section>
</div>
<!--Painel inferior-->
<footer class="app__painel-filtros">
    <ul class="filtros__lista">
        <li
        class="filtros__item">
    <button 
    class="filtros__botao" data-categoria="roupas">Roupas</button>
</li>
<li 
class="filtros__botao" data-categoria="acessórios">Acessórios</button>
</li>
    </ul>
</footer>
    </main>
</body>
</html>
